# Per-package release config for domain-check-lib
# Updates version references in the READMEs and sample CLI output

pre-release-replacements = [
  { file = "README.md", search = "domain-check-lib = \"[^\"]*\"", replace = "domain-check-lib = \"{{version}}\"" },
  { file = "../README.md", search = "domain-check-lib = \"[^\"]*\"", replace = "domain-check-lib = \"{{version}}\"" },
  { file = "../README.md", search = "domain-check v[0-9]+\\.[0-9]+\\.[0-9]+ —", replace = "domain-check v{{version}} —" },
  { file = "../docs/CLI.md", search = "domain-check v[0-9]+\\.[0-9]+\\.[0-9]+ —", replace = "domain-check v{{version}} —" },
]
