name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Weekly run to catch toolchain/registry regressions (security audit runs daily in security.yml)
    - cron: '0 2 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Check code formatting
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

  # Static analysis with Clippy
  clippy:
    name: Clippy Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo build
        uses: actions/cache@v6
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings -A clippy::uninlined_format_args

  # Test on multiple Rust versions
  test:
    name: Test Suite
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable, beta, 1.88.0]  # 1.88.0 = MSRV (rust-version in Cargo.toml)
        exclude:
          # Only test MSRV on Ubuntu to save CI time
          - os: windows-latest
            rust: 1.88.0
          - os: macos-latest
            rust: 1.88.0
          # Only test beta on Ubuntu
          - os: windows-latest
            rust: beta
          - os: macos-latest
            rust: beta
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-${{ matrix.rust }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.rust }}-cargo-registry-

      - name: Cache cargo build
        uses: actions/cache@v6
        with:
          path: target
          key: ${{ runner.os }}-${{ matrix.rust }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.rust }}-cargo-build-

      - name: Build workspace
        run: cargo build --workspace --verbose

      # Runs unit, integration, and doc tests for every crate in one pass
      - name: Test workspace
        run: cargo test --workspace --all-features --verbose

  # Integration tests
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-integration-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-integration-

      - name: Build release binaries
        run: |
          cargo build --release -p domain-check
          cargo build --release -p domain-check-mcp

      - name: Test CLI functionality
        run: |
          # Test basic domain check
          ./target/release/domain-check example.com
          
          # Test multiple domains
          ./target/release/domain-check example startup -t com,org
          
          # Test JSON output
          ./target/release/domain-check google.com --json
          
          # Test info flag
          ./target/release/domain-check google.com --info

      - name: Test library integration
        run: |
          # Test that library can be used externally
          cd /tmp
          cargo init --name integration_test
          
          # Write the test directly to src/main.rs
          cat > src/main.rs << 'EOF'
          use domain_check_lib::DomainChecker;
          
          #[tokio::main]
          async fn main() -> Result<(), Box<dyn std::error::Error>> {
              let checker = DomainChecker::new();
              let result = checker.check_domain("example.com").await?;
              println!("Domain check result: {:?}", result.available);
              Ok(())
          }
          EOF
          
          # Add dependencies
          cat >> Cargo.toml << EOF
          domain-check-lib = { path = "${{ github.workspace }}/domain-check-lib" }
          tokio = { version = "1", features = ["full"] }
          EOF
          
          # Run the test
          cargo run

  # Check documentation
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-docs-${{ hashFiles('**/Cargo.lock') }}

      - name: Check library documentation
        run: cargo doc -p domain-check-lib --no-deps --document-private-items

      - name: Check CLI documentation
        run: cargo doc -p domain-check --no-deps --document-private-items

      - name: Check MCP server documentation
        run: cargo doc -p domain-check-mcp --no-deps --document-private-items

      - name: Check for broken links in docs
        run: cargo doc --workspace --no-deps

  # Check that every combination of library features compiles (rdap/whois/bootstrap)
  feature-combinations:
    name: Feature Combinations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-hack
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack

      - name: Check feature powerset
        run: cargo hack check -p domain-check-lib --feature-powerset --no-dev-deps
